name: Security audit

# Supply-chain and hardening checks that run on every change, plus a weekly sweep
# so a newly published advisory is noticed even if nobody touches the code.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # Deliberately package-manager-neutral: this name is a required status check on
    # main, and renaming it wedges every merge behind a check that never reports.
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Blocking gate: what actually ships to users. `dependencies` are bundled
      # into the app, so a high advisory here is a real exposure.
      #
      # `bun audit` has no --omit=dev equivalent and its output carries no prod/dev
      # distinction, so scripts/audit-prod.mjs resolves a throwaway tree containing
      # only `dependencies` and audits that. Needs no node_modules and no lockfile
      # from this repo, hence no install step above it.
      - name: Audit shipped dependencies
        run: bun run audit

      # Informational: the dev toolchain (electron-builder, vite and friends)
      # carries advisories that cannot currently be fixed forward — resolving them
      # drags electron-builder *backwards* to 22.x, which is far worse than the
      # advisories it silences. Reported on every run so the situation stays visible
      # and can be revisited when upstream releases fixes.
      - name: Report dev-dependency advisories (informational)
        if: always()
        run: bun audit || true

  dependency-review:
    name: Dependency review
    # Pull requests only, and only once the repository is public — the action
    # relies on the dependency graph, which needs Advanced Security when private.
    if: ${{ github.event_name == 'pull_request' && github.event.repository.private != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Review dependency changes in this PR
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences would change this project's MIT terms, so a new
          # dependency carrying one should be a deliberate decision.
          deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0, SSPL-1.0

  hardening:
    name: Workflow and Electron hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # Asserts the Electron security invariants (context isolation, no node
      # integration, no shell-string command execution, redacted history) that
      # SECURITY.md promises. Cheap, and it fails loudly if someone regresses one.
      - name: Electron security invariants
        run: bun run test:security

      - name: Every workflow declares least-privilege permissions
        run: |
          missing=0
          for f in .github/workflows/*.yml; do
            if ! grep -qE '^permissions:' "$f"; then
              echo "::error file=$f::workflow has no top-level permissions block"
              missing=1
            fi
          done
          exit $missing

      # bun is the only supported package manager: a second lockfile makes
      # electron-builder pick its package manager by scanning for lockfiles and
      # rebuild the native module against the wrong tree.
      - name: bun is the only package manager
        run: |
          problems=0
          for f in package-lock.json npm-shrinkwrap.json yarn.lock pnpm-lock.yaml; do
            if [ -e "$f" ]; then
              echo "::error file=$f::$f must not be committed — this project installs with bun"
              problems=1
            fi
          done
          if [ ! -e bun.lock ]; then
            echo "::error::bun.lock is missing; run bun install and commit it"
            problems=1
          fi
          # .bun-version drives CI, packageManager documents it for tooling; drift
          # between them means CI and contributors run different bun versions.
          pinned=$(tr -d '[:space:]' < .bun-version)
          declared=$(node -p "require('./package.json').packageManager.replace('bun@','')")
          if [ "$pinned" != "$declared" ]; then
            echo "::error::.bun-version ($pinned) and package.json packageManager ($declared) disagree"
            problems=1
          fi
          exit $problems
