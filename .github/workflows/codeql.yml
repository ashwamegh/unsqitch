name: CodeQL

# Static analysis for the renderer and the Electron main process. Code scanning is
# free for public repositories; on a private repository it needs GitHub Advanced
# Security, so the job skips itself rather than failing until the repo is public.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries are applied to unchanged code too.
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Skips on a private repository; `github.event.repository` is absent on a
    # schedule, where `null != true` is true, so scheduled runs still happen.
    if: ${{ github.event.repository.private != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: ${{ matrix.language }}
          # JavaScript and TypeScript are extracted from source, so there is nothing
          # to compile. This replaces the Autobuild step, which has no bun awareness
          # and would only try (and fail) to guess an install command.
          build-mode: none
          # security-and-quality adds maintainability queries on top of the
          # default security ones.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          category: /language:${{ matrix.language }}
