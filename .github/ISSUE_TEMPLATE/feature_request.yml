name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the situation you are in, not just the feature you have in mind — it
        often reveals a simpler fix.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like UnSqitch to do?
    validations:
      required: true

  - type: input
    id: sqitch-command
    attributes:
      label: Related sqitch command
      description: If this maps to a Sqitch command, which one?
      placeholder: sqitch rework

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including doing it in the CLI instead, and why that is not enough.
