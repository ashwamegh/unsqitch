version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Electron, Vite and the toolchain move together; one PR is easier to verify
      # than five, because each needs a native rebuild and a smoke test.
      build-toolchain:
        patterns:
          - "electron*"
          - "vite"
          - "@vitejs/*"
          - "electron-vite"
          - "electron-builder"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/*"
          - "@testing-library/*"
      linting:
        patterns:
          - "@biomejs/*"
          - "@commitlint/*"
          - "husky"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
